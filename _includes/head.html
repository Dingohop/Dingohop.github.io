<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0A0B">

{% seo %}

<!-- Keep page resources on this site; portfolio links open YouTube separately. -->
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">

<link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/logo-mark-blue.svg' | relative_url }}">
<script src="{{ '/script.js' | relative_url }}" defer></script>

{% if page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "Taylor's Design Media",
  "alternateName": "Taylor's Design LLC",
  "url": "{{ site.url }}",
  "logo": "{{ '/assets/images/logo-full-blue-pink.svg' | absolute_url }}",
  "image": "{{ '/assets/images/social-card.png' | absolute_url }}",
  "email": "{{ site.email }}",
  "description": {{ site.description | strip_newlines | strip | jsonify }},
  "founder": {
    "@type": "Person",
    "name": "Michael Taylor",
    "jobTitle": "Creative Services Provider"
  },
  "serviceType": [
    "Video Editing",
    "Informational Websites and Blogs",
    "Promotional Design",
    "Website Care"
  ],
  "areaServed": "US"
}
</script>
{% endif %}
