<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12191D">

{% seo %}

<!-- Keep page resources on this site; portfolio links open YouTube separately. -->
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">

<link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/logo-mark-studio.svg' | relative_url }}">
<script src="{{ '/script.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>

{% if page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "name": "Michael Taylor — Selected Work",
  "url": "{{ site.url }}",
  "image": "{{ '/assets/images/social-card-studio.jpg' | absolute_url }}",
  "description": {{ site.description | strip_newlines | strip | jsonify }},
  "mainEntity": {
    "@type": "Person",
    "name": "Michael Taylor",
    "email": "{{ site.email }}",
    "url": "{{ site.url }}",
    "knowsAbout": ["Video editing", "Design", "Web development"]
  }
}
</script>
{% endif %}
