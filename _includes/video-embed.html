{%- assign p = include.project -%}
<div class="player-slot{% if p.aspect == 'portrait' %} is-portrait{% endif %}">
  {%- if p.video_id -%}
  <a class="video-preview" href="https://www.youtube.com/watch?v={{ p.video_id | escape }}"
     target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">
    {%- if p.thumbnail -%}
    <img src="{{ p.thumbnail | relative_url }}" alt="" loading="lazy" decoding="async">
    {%- endif -%}
    <span class="preview-shade" aria-hidden="true"></span>
    <span class="play-button" aria-hidden="true">&#9654;</span>
    <span class="preview-label">Watch {{ p.title }} on YouTube (opens in a new tab)</span>
  </a>
  {%- elsif p.video_file -%}
  <video class="self-hosted-player" controls preload="none"
         {% if p.thumbnail %}poster="{{ p.thumbnail | relative_url }}"{% endif %}>
    <source src="{{ p.video_file | relative_url }}" type="video/mp4">
  </video>
  {%- elsif p.thumbnail -%}
  <div class="project-image-preview">
    <img src="{{ p.thumbnail | relative_url }}" alt="" loading="lazy" decoding="async">
    <span class="preview-shade" aria-hidden="true"></span>
    <span class="preview-label">Video link to be added</span>
  </div>
  {%- else -%}
  <div class="video-placeholder">
    <strong>{{ p.title }}</strong>
    <span>Video link to be added</span>
  </div>
  {%- endif -%}
</div>
