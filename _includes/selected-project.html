{%- assign p = include.project -%}
<article class="selected-project">
  <a class="project-image-link" href="https://www.youtube.com/watch?v={{ p.video_id | escape }}"
     target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer"
     aria-label="Watch {{ p.title | escape }} on YouTube (opens in a new tab)">
    <img src="{{ p.thumbnail | relative_url }}" alt="" width="1280" height="720" loading="lazy" decoding="async">
  </a>
  <h3><a href="https://www.youtube.com/watch?v={{ p.video_id | escape }}"
     target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">{{ p.title }}<span class="visually-hidden"> on YouTube (opens in a new tab)</span></a></h3>
  <p>{{ p.category }}</p>
</article>
