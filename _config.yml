title: Taylor's Design Media
tagline: Video, Web and Promotional Design
description: >-
  Taylor's Design provides video editing, informational websites and blogs,
  promotional design, and website care for churches, small businesses, creators,
  nonprofits, and other clients.
url: https://taylorsdesignllc.com
baseurl: ""

author:
  name: Michael Taylor
email: michaeltaylor82@gmail.com
business_name: Taylor's Design LLC
logo: /assets/images/logo-mark-blue.svg
image: /assets/images/social-card.png

twitter:
  card: summary_large_image

collections:
  projects:
    # output: false -- every project renders inline on the one page,
    # so no per-project pages are generated.
    output: false

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - _preview
  - AGENTS.md
  - Claude outputs
  - test
  - README.md
  - ACCESSIBILITY-CHECKLIST.md
  - Dingohop.github.io.code-workspace
  - Gemfile
  - Gemfile.lock
  - vendor
