title: Michael Taylor
tagline: Video, Design & Web
description: >-
  Selected work by Michael Taylor in video editing, design, and web development.
  A portfolio of completed video projects and web projects in progress.
url: https://taylorsdesignllc.com
baseurl: ""

author:
  name: Michael Taylor
email: michaeltaylor82@gmail.com
business_name: Taylor's Design LLC
logo: /assets/images/logo-mark-studio.svg
image: /assets/images/social-card-studio.jpg

# jekyll-seo-tag reads page images, including front-matter defaults.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/social-card-studio.jpg
        width: 1200
        height: 630
        alt: "Michael Taylor — selected work in video, design, and web development"

collections:
  projects:
    # output: false -- every project renders inline on the one page,
    # so no per-project pages are generated.
    output: false

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - _preview
  - AGENTS.md
  - Claude outputs
  - test
  - README.md
  - ACCESSIBILITY-CHECKLIST.md
  - design-qa.md
  - Dingohop.github.io.code-workspace
  - Gemfile
  - Gemfile.lock
  - vendor
